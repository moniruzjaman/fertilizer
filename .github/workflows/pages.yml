name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_BASE: https://moniruzjaman.github.io/fertilizer

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/site-builder/package-lock.json

      - name: Install PDF raster tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core fontconfig

      - name: Install builder
        working-directory: tools/site-builder
        run: npm ci

      - name: Test builder
        working-directory: tools/site-builder
        run: npm test

      - name: Build site
        working-directory: tools/site-builder
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
